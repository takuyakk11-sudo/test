<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインドフルネス・深呼吸ガイド</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            300: '#5eead4',
                            500: '#14b8a6',
                            700: '#0f766e',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS for glowing effects and fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #111827 100%);
        }

        /* Pulsing & Glowing elements */
        .breath-glow {
            filter: drop-shadow(0 0 35px rgba(20, 184, 166, 0.35));
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(20, 184, 166, 0.4);
        }

        .glass-button.active {
            background: rgba(20, 184, 166, 0.25);
            border-color: rgba(45, 212, 191, 0.6);
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.3);
        }

        /* Range slider styling */
        input[type=range] {
            accent-color: #14b8a6;
        }

        /* SVG Breath Circle Animation Smoothness */
        .breath-circle-container {
            transition: transform 0.1s linear;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-teal-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full p-4 flex justify-between items-center z-20 max-w-5xl mx-auto">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-teal-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                <i data-lucide="wind" class="w-6 h-6 text-slate-950"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-teal-200 via-cyan-200 to-indigo-200 bg-clip-text text-transparent">マインドフル呼吸</h1>
                <p class="text-xs text-slate-400">心身を整える深呼吸ガイド</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Fullscreen Button -->
            <button id="fullscreen-btn" class="p-2.5 rounded-full glass-button text-slate-300 hover:text-white" title="フルスクリーン切り替え">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
            <!-- Sound Toggle -->
            <button id="sound-btn" class="p-2.5 rounded-full glass-button text-teal-400" title="効果音 ON/OFF">
                <i data-lucide="volume-2" id="sound-icon" class="w-5 h-5"></i>
            </button>
            <!-- BGM Toggle -->
            <button id="bgm-btn" class="p-2.5 rounded-full glass-button text-slate-300 hover:text-white" title="BGM/環境音">
                <i data-lucide="music" id="bgm-icon" class="w-5 h-5"></i>
            </button>
            <!-- Settings Modal Trigger -->
            <button id="settings-btn" class="p-2.5 rounded-full glass-button text-slate-300 hover:text-white" title="設定">
                <i data-lucide="sliders" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative z-10 my-auto">

        <!-- Ambient Background Glows -->
        <div id="ambient-glow" class="absolute w-[320px] sm:w-[480px] h-[320px] sm:h-[480px] rounded-full bg-gradient-to-r from-teal-600/20 to-indigo-600/20 blur-3xl -z-10 transition-all duration-1000"></div>

        <!-- Breathing Guide Circle (SVG + CSS) -->
        <div class="relative flex items-center justify-center w-72 h-72 sm:w-96 sm:h-96 my-4">
            <!-- SVG Pulsing Guide Ring -->
            <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="0.5" fill="none" class="text-teal-500/20" />
                <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 4" fill="none" class="text-cyan-400/30" />
            </svg>

            <!-- Outer Ripple Rings -->
            <div id="ring-outer" class="absolute inset-0 rounded-full border border-teal-500/20 transition-all duration-700"></div>
            <div id="ring-middle" class="absolute inset-4 rounded-full border border-cyan-500/20 transition-all duration-700"></div>
            
            <!-- Animated Main Center Circle -->
            <div id="breath-circle" class="breath-glow absolute w-48 h-48 sm:w-64 sm:h-64 rounded-full bg-gradient-to-tr from-teal-500/30 via-cyan-500/40 to-indigo-500/30 border border-teal-300/40 flex flex-col items-center justify-center transform transition-all duration-300 shadow-2xl cursor-pointer">
                <!-- Inner Light Glow Backdrop -->
                <div class="absolute inset-2 rounded-full bg-slate-950/50 backdrop-blur-sm -z-10"></div>

                <!-- Phase Text -->
                <span id="phase-label" class="text-2xl sm:text-3xl font-bold text-white tracking-widest mb-1 drop-shadow-md">準備完了</span>
                <!-- Counter / Subtitle -->
                <span id="phase-timer" class="text-4xl sm:text-5xl font-extrabold text-teal-300 font-mono tracking-wider">0</span>
                <span id="phase-instruction" class="text-xs sm:text-sm text-slate-300 mt-2 font-medium">タップして開始</span>
            </div>
        </div>

        <!-- Session Status Info Bar -->
        <div class="flex items-center space-x-6 my-4 text-xs sm:text-sm text-slate-400 bg-slate-900/60 px-6 py-2.5 rounded-full border border-slate-800">
            <div class="flex items-center space-x-2">
                <i data-lucide="repeat" class="w-4 h-4 text-teal-400"></i>
                <span>呼吸回数: <strong id="cycle-count" class="text-slate-100 font-bold">0</strong> 回</span>
            </div>
            <div class="h-3 w-px bg-slate-700"></div>
            <div class="flex items-center space-x-2">
                <i data-lucide="clock" class="w-4 h-4 text-indigo-400"></i>
                <span>残り時間: <strong id="time-remaining" class="text-slate-100 font-bold">--:--</strong></span>
            </div>
        </div>

        <!-- Primary Control Action Buttons -->
        <div class="flex items-center space-x-4 mt-2">
            <button id="start-btn" class="px-8 py-3.5 rounded-full bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-400 hover:to-cyan-400 text-slate-950 font-bold text-lg shadow-lg shadow-teal-500/25 transform active:scale-95 transition-all flex items-center space-x-2">
                <i data-lucide="play" id="start-icon" class="w-5 h-5 fill-current"></i>
                <span id="start-text">スタート</span>
            </button>
            <button id="reset-btn" class="p-3.5 rounded-full glass-button text-slate-400 hover:text-white transform active:scale-95 transition-all" title="リセット">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>
        </div>

    </main>

    <!-- Quick Presets Toolbar -->
    <footer class="w-full p-4 z-20 max-w-4xl mx-auto">
        <div class="glass-card p-3 sm:p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <!-- Pattern Presets -->
            <div class="flex items-center space-x-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 justify-start sm:justify-center">
                <button data-pattern="478" class="pattern-btn glass-button active px-3 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">
                    4-7-8 呼吸<span class="block text-[10px] text-slate-400 font-normal">安眠・緊張緩和</span>
                </button>
                <button data-pattern="box" class="pattern-btn glass-button px-3 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">
                    ボックス呼吸<span class="block text-[10px] text-slate-400 font-normal">4-4-4-4 集中</span>
                </button>
                <button data-pattern="equal" class="pattern-btn glass-button px-3 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">
                    イコライザー<span class="block text-[10px] text-slate-400 font-normal">5-5 パニック緩和</span>
                </button>
                <button data-pattern="relax" class="pattern-btn glass-button px-3 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">
                    深層リラックス<span class="block text-[10px] text-slate-400 font-normal">4-6 ストレス解消</span>
                </button>
            </div>

            <!-- Timer Presets -->
            <div class="flex items-center space-x-1 border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-3 w-full sm:w-auto justify-end">
                <span class="text-xs text-slate-400 mr-2 hidden sm:inline">時間:</span>
                <button data-timer="60" class="timer-btn glass-button px-3 py-1.5 rounded-lg text-xs font-medium">1分</button>
                <button data-timer="180" class="timer-btn glass-button active px-3 py-1.5 rounded-lg text-xs font-medium">3分</button>
                <button data-timer="300" class="timer-btn glass-button px-3 py-1.5 rounded-lg text-xs font-medium">5分</button>
                <button data-timer="0" class="timer-btn glass-button px-3 py-1.5 rounded-lg text-xs font-medium">無制限</button>
            </div>
        </div>
    </footer>

    <!-- Modal: Detailed Settings & Customization -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md p-6 rounded-3xl shadow-2xl border border-slate-800 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2 text-teal-300">
                    <i data-lucide="sliders" class="w-5 h-5"></i> カスタム設定
                </h2>
                <button id="close-modal-btn" class="p-2 text-slate-400 hover:text-white rounded-full">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Custom Breath Timers -->
            <div class="space-y-4 mb-6">
                <h3 class="text-xs font-semibold text-slate-400 tracking-wider uppercase">呼吸フェーズ（秒）</h3>
                
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">息を吸う (Inhale)</span>
                        <span id="inhale-val" class="font-mono text-teal-400 font-bold">4 秒</span>
                    </div>
                    <input type="range" id="inhale-range" min="2" max="15" value="4" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">息を止める (Hold - 吸気後)</span>
                        <span id="holdIn-val" class="font-mono text-teal-400 font-bold">7 秒</span>
                    </div>
                    <input type="range" id="holdIn-range" min="0" max="20" value="7" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">息を吐く (Exhale)</span>
                        <span id="exhale-val" class="font-mono text-teal-400 font-bold">8 秒</span>
                    </div>
                    <input type="range" id="exhale-range" min="2" max="20" value="8" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">息を止める (Hold - 呼気後)</span>
                        <span id="holdOut-val" class="font-mono text-teal-400 font-bold">0 秒</span>
                    </div>
                    <input type="range" id="holdOut-range" min="0" max="20" value="0" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- Sound & BGM Settings -->
            <div class="space-y-4 border-t border-slate-800 pt-4 mb-6">
                <h3 class="text-xs font-semibold text-slate-400 tracking-wider uppercase">サウンド & 環境音</h3>
                
                <div>
                    <label class="block text-sm text-slate-300 mb-2">BGM タイプ</label>
                    <select id="bgm-type-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-teal-500">
                        <option value="sine-waves">静寂な波動 (Soft Synth Wave)</option>
                        <option value="pink-noise">静かな雨・波音 (Pink Noise)</option>
                        <option value="singing-bowl">瞑想ディープドローン (Deep Ground Drone)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">音量</span>
                        <span id="vol-val" class="font-mono text-slate-400">60%</span>
                    </div>
                    <input type="range" id="vol-range" min="0" max="100" value="60" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <button id="apply-custom-btn" class="w-full py-3 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-teal-500/20">
                設定を適用してカスタム実行
            </button>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Application State
        const state = {
            isRunning: false,
            phase: 'idle', // 'inhale', 'holdIn', 'exhale', 'holdOut', 'idle'
            timerId: null,
            sessionTimerId: null,
            cycleCount: 0,
            timeRemaining: 180, // default 3 min (seconds)
            selectedDuration: 180,
            soundEnabled: true,
            bgmEnabled: false,
            volume: 0.6,
            bgmType: 'sine-waves',
            
            // Current Pattern Timings (in seconds)
            pattern: {
                inhale: 4,
                holdIn: 7,
                exhale: 8,
                holdOut: 0
            }
        };

        // Presets Definition
        const presets = {
            '478': { inhale: 4, holdIn: 7, exhale: 8, holdOut: 0 },
            'box': { inhale: 4, holdIn: 4, exhale: 4, holdOut: 4 },
            'equal': { inhale: 5, holdIn: 0, exhale: 5, holdOut: 0 },
            'relax': { inhale: 4, holdIn: 0, exhale: 6, holdOut: 0 }
        };

        // DOM Elements
        const breathCircle = document.getElementById('breath-circle');
        const ambientGlow = document.getElementById('ambient-glow');
        const phaseLabel = document.getElementById('phase-label');
        const phaseTimer = document.getElementById('phase-timer');
        const phaseInstruction = document.getElementById('phase-instruction');
        const startBtn = document.getElementById('start-btn');
        const startText = document.getElementById('start-text');
        const startIcon = document.getElementById('start-icon');
        const resetBtn = document.getElementById('reset-btn');
        const cycleCountEl = document.getElementById('cycle-count');
        const timeRemainingEl = document.getElementById('time-remaining');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const bgmBtn = document.getElementById('bgm-btn');
        const bgmIcon = document.getElementById('bgm-icon');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        // Modal & Controls
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const applyCustomBtn = document.getElementById('apply-custom-btn');

        const inhaleRange = document.getElementById('inhale-range');
        const holdInRange = document.getElementById('holdIn-range');
        const exhaleRange = document.getElementById('exhale-range');
        const holdOutRange = document.getElementById('holdOut-range');

        const inhaleVal = document.getElementById('inhale-val');
        const holdInVal = document.getElementById('holdIn-val');
        const exhaleVal = document.getElementById('exhale-val');
        const holdOutVal = document.getElementById('holdOut-val');

        const bgmTypeSelect = document.getElementById('bgm-type-select');
        const volRange = document.getElementById('vol-range');
        const volVal = document.getElementById('vol-val');

        // Web Audio API Context
        let audioCtx = null;
        let bgmOscillator1 = null;
        let bgmOscillator2 = null;
        let bgmGainNode = null;
        let noiseNode = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 1. Inhale Sound: Low, Gentle Soft Tone (F3 ~174.61Hz)
        function playInhaleTone(duration = 1.8) {
            if (!state.soundEnabled || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(174.61, audioCtx.currentTime); // Low F3 tone

                // Soft envelope with gentle attack
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(state.volume * 0.12, audioCtx.currentTime + 0.35);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio Playback Error", e);
            }
        }

        // 2. Hold Sound: Warm, Soothing Piano Tone (A3 ~220Hz / C#4 ~277.18Hz / E4 ~329.63Hz)
        function playDeepHoldTone(duration = 3.0) {
            if (!state.soundEnabled || !audioCtx) return;

            try {
                const holdNotes = [
                    { freq: 220.00, gainRatio: 0.6 }, // A3
                    { freq: 277.18, gainRatio: 0.4 }, // C#4
                    { freq: 329.63, gainRatio: 0.3 }  // E4
                ];

                const masterGain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(650, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + duration);

                masterGain.connect(filter);
                filter.connect(audioCtx.destination);

                const baseVolume = state.volume * 0.08;

                holdNotes.forEach(note => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime);

                    const now = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(baseVolume * note.gainRatio, now + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc.connect(gain);
                    gain.connect(masterGain);

                    osc.start(now);
                    osc.stop(now + duration);
                });
            } catch (e) {
                console.error("Hold Piano Tone Playback Error", e);
            }
        }

        // 3. Exhale Sound: Warm, Soothing Piano Tone
        function playExhaleTone(duration = 3.5) {
            if (!state.soundEnabled || !audioCtx) return;

            try {
                const pianoNotes = [
                    { freq: 174.61, gainRatio: 0.8 },
                    { freq: 261.63, gainRatio: 0.5 },
                    { freq: 349.23, gainRatio: 0.25 }
                ];

                const masterGain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + duration);

                masterGain.connect(filter);
                filter.connect(audioCtx.destination);

                const baseVolume = state.volume * 0.09;

                pianoNotes.forEach(note => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime);

                    const now = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(baseVolume * note.gainRatio, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc.connect(gain);
                    gain.connect(masterGain);

                    osc.start(now);
                    osc.stop(now + duration);
                });
            } catch (e) {
                console.error("Exhale Piano Tone Playback Error", e);
            }
        }

        // Ambient Background Sound Generator
        function startBGM() {
            initAudio();
            if (!audioCtx) return;
            stopBGM();

            bgmGainNode = audioCtx.createGain();
            bgmGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            bgmGainNode.gain.linearRampToValueAtTime(state.volume * 0.15, audioCtx.currentTime + 2);
            bgmGainNode.connect(audioCtx.destination);

            if (state.bgmType === 'sine-waves' || state.bgmType === 'singing-bowl') {
                const freq1 = state.bgmType === 'singing-bowl' ? 82 : 130;
                const freq2 = state.bgmType === 'singing-bowl' ? 123 : 196;

                bgmOscillator1 = audioCtx.createOscillator();
                bgmOscillator2 = audioCtx.createOscillator();

                bgmOscillator1.type = 'sine';
                bgmOscillator2.type = 'sine';

                bgmOscillator1.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                bgmOscillator2.frequency.setValueAtTime(freq2, audioCtx.currentTime);

                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.setValueAtTime(0.08, audioCtx.currentTime);
                lfoGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                lfo.connect(lfoGain);
                lfoGain.connect(bgmGainNode.gain);
                lfo.start();

                bgmOscillator1.connect(bgmGainNode);
                bgmOscillator2.connect(bgmGainNode);

                bgmOscillator1.start();
                bgmOscillator2.start();
            } else if (state.bgmType === 'pink-noise') {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.04;
                    b6 = white * 0.115926;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(bgmGainNode);
                noiseNode.start();
            }
        }

        function stopBGM() {
            if (bgmGainNode && audioCtx) {
                bgmGainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                setTimeout(() => {
                    if (bgmOscillator1) { bgmOscillator1.stop(); bgmOscillator1.disconnect(); bgmOscillator1 = null; }
                    if (bgmOscillator2) { bgmOscillator2.stop(); bgmOscillator2.disconnect(); bgmOscillator2 = null; }
                    if (noiseNode) { noiseNode.stop(); noiseNode.disconnect(); noiseNode = null; }
                }, 500);
            }
        }

        // Haptic Feedback for Mobile Devices
        function triggerHaptic(type = 'light') {
            if ('vibrate' in navigator) {
                if (type === 'light') navigator.vibrate(30);
                if (type === 'medium') navigator.vibrate(50);
                if (type === 'double') navigator.vibrate([40, 50, 40]);
            }
        }

        // Format Seconds into MM:SS Display
        function formatTime(seconds) {
            if (seconds === 0 && state.selectedDuration === 0) return '無制限';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Main Breathing Engine Logic
        let currentPhaseTimeLeft = 0;

        function startSession() {
            initAudio();
            state.isRunning = true;
            updateUI();

            if (state.bgmEnabled) {
                startBGM();
            }

            // Session Countdown Timer
            if (state.selectedDuration > 0) {
                state.timeRemaining = state.selectedDuration;
                state.sessionTimerId = setInterval(() => {
                    state.timeRemaining--;
                    timeRemainingEl.textContent = formatTime(state.timeRemaining);

                    if (state.timeRemaining <= 0) {
                        endSession(true);
                    }
                }, 1000);
            } else {
                timeRemainingEl.textContent = '無制限';
            }

            // Start First Phase
            switchPhase('inhale');
        }

        function pauseSession() {
            state.isRunning = false;
            clearInterval(state.timerId);
            clearInterval(state.sessionTimerId);
            stopBGM();
            updateUI();
            phaseInstruction.textContent = '一時停止中（タップで再開）';
        }

        function resetSession() {
            pauseSession();
            state.phase = 'idle';
            state.cycleCount = 0;
            state.timeRemaining = state.selectedDuration;
            cycleCountEl.textContent = '0';
            timeRemainingEl.textContent = formatTime(state.timeRemaining);

            // Reset Circle Scale & Glows
            breathCircle.style.transform = 'scale(1)';
            ambientGlow.style.transform = 'scale(1)';
            ambientGlow.className = 'absolute w-[320px] sm:w-[480px] h-[320px] sm:h-[480px] rounded-full bg-gradient-to-r from-teal-600/20 to-indigo-600/20 blur-3xl -z-10 transition-all duration-1000';

            phaseLabel.textContent = '準備完了';
            phaseTimer.textContent = '0';
            phaseInstruction.textContent = 'タップして開始';
        }

        function endSession(completed = false) {
            pauseSession();
            playExhaleTone(2.5);
            triggerHaptic('double');

            if (completed) {
                phaseLabel.textContent = 'お疲れ様でした';
                phaseTimer.textContent = '✓';
                phaseInstruction.textContent = '心が穏やかになりました';
            }
        }

        function switchPhase(nextPhase) {
            if (!state.isRunning) return;

            state.phase = nextPhase;
            const duration = state.pattern[nextPhase];

            // Handle Skipping Phase if duration is 0
            if (duration <= 0) {
                advanceToNextPhase();
                return;
            }

            currentPhaseTimeLeft = duration;
            phaseTimer.textContent = currentPhaseTimeLeft;

            // Phase UI and Sound Transitions
            if (nextPhase === 'inhale') {
                phaseLabel.textContent = '息を吸う';
                phaseInstruction.textContent = '鼻からゆっくり深呼吸';
                playInhaleTone(2.0);
                triggerHaptic('light');

                // Animate Circle Expansion
                breathCircle.style.transition = `transform ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
                breathCircle.style.transform = 'scale(1.4)';
                ambientGlow.style.transition = `transform ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
                ambientGlow.style.transform = 'scale(1.5)';
                ambientGlow.className = 'absolute w-[320px] sm:w-[480px] h-[320px] sm:h-[480px] rounded-full bg-gradient-to-r from-teal-500/30 to-cyan-400/30 blur-3xl -z-10';

            } else if (nextPhase === 'holdIn') {
                phaseLabel.textContent = '息を止める';
                phaseInstruction.textContent = '肩の力を抜いて保ちます';
                playDeepHoldTone(Math.min(duration, 3.5));
                triggerHaptic('medium');

                // Maintain Scale with gentle steady pulse
                breathCircle.style.transition = `transform 0.3s ease`;
                breathCircle.style.transform = 'scale(1.4)';

            } else if (nextPhase === 'exhale') {
                phaseLabel.textContent = '息を吐く';
                phaseInstruction.textContent = '口から細く長く吐き出します';
                playExhaleTone(Math.min(duration, 3.0));
                triggerHaptic('light');

                // Animate Circle Contraction
                breathCircle.style.transition = `transform ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
                breathCircle.style.transform = 'scale(0.85)';
                ambientGlow.style.transition = `transform ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
                ambientGlow.style.transform = 'scale(0.8)';
                ambientGlow.className = 'absolute w-[320px] sm:w-[480px] h-[320px] sm:h-[480px] rounded-full bg-gradient-to-r from-indigo-600/30 to-purple-600/30 blur-3xl -z-10';

            } else if (nextPhase === 'holdOut') {
                phaseLabel.textContent = '息を止める';
                phaseInstruction.textContent = '静かに呼吸を止めます';
                playDeepHoldTone(Math.min(duration, 3.5));
                triggerHaptic('medium');

                breathCircle.style.transition = `transform 0.3s ease`;
                breathCircle.style.transform = 'scale(0.85)';
            }

            // Phase Countdown Ticker
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                currentPhaseTimeLeft--;
                if (currentPhaseTimeLeft >= 0) {
                    phaseTimer.textContent = currentPhaseTimeLeft;
                }

                if (currentPhaseTimeLeft <= 0) {
                    clearInterval(state.timerId);
                    advanceToNextPhase();
                }
            }, 1000);
        }

        function advanceToNextPhase() {
            if (state.phase === 'inhale') {
                switchPhase('holdIn');
            } else if (state.phase === 'holdIn') {
                switchPhase('exhale');
            } else if (state.phase === 'exhale') {
                if (state.pattern.holdOut > 0) {
                    switchPhase('holdOut');
                } else {
                    incrementCycle();
                    switchPhase('inhale');
                }
            } else if (state.phase === 'holdOut') {
                incrementCycle();
                switchPhase('inhale');
            }
        }

        function incrementCycle() {
            state.cycleCount++;
            cycleCountEl.textContent = state.cycleCount;
        }

        // UI State Update
        function updateUI() {
            if (state.isRunning) {
                startText.textContent = '一時停止';
                startIcon.setAttribute('data-lucide', 'pause');
                startBtn.classList.remove('from-teal-500', 'to-cyan-500');
                startBtn.classList.add('from-amber-500', 'to-orange-500');
            } else {
                startText.textContent = state.phase === 'idle' ? 'スタート' : '再開';
                startIcon.setAttribute('data-lucide', 'play');
                startBtn.classList.remove('from-amber-500', 'to-orange-500');
                startBtn.classList.add('from-teal-500', 'to-cyan-500');
            }
            lucide.createIcons();
        }

        // Event Listeners
        breathCircle.addEventListener('click', () => {
            if (state.isRunning) {
                pauseSession();
            } else {
                startSession();
            }
        });

        startBtn.addEventListener('click', () => {
            if (state.isRunning) {
                pauseSession();
            } else {
                startSession();
            }
        });

        resetBtn.addEventListener('click', resetSession);

        // Preset Button Handler
        document.querySelectorAll('.pattern-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');

                const patternKey = target.dataset.pattern;
                if (presets[patternKey]) {
                    state.pattern = { ...presets[patternKey] };
                    resetSession();
                }
            });
        });

        // Timer Duration Handler
        document.querySelectorAll('.timer-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');

                const duration = parseInt(target.dataset.timer, 10);
                state.selectedDuration = duration;
                resetSession();
            });
        });

        // Toggle Sound FX
        soundBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            soundIcon.setAttribute('data-lucide', state.soundEnabled ? 'volume-2' : 'volume-x');
            soundBtn.classList.toggle('text-teal-400', state.soundEnabled);
            soundBtn.classList.toggle('text-slate-400', !state.soundEnabled);
            lucide.createIcons();
        });

        // Toggle BGM
        bgmBtn.addEventListener('click', () => {
            initAudio();
            state.bgmEnabled = !state.bgmEnabled;
            bgmBtn.classList.toggle('active', state.bgmEnabled);
            bgmBtn.classList.toggle('text-teal-400', state.bgmEnabled);

            if (state.bgmEnabled && state.isRunning) {
                startBGM();
            } else {
                stopBGM();
            }
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Settings Modal Listeners
        settingsBtn.addEventListener('click', () => {
            inhaleRange.value = state.pattern.inhale;
            holdInRange.value = state.pattern.holdIn;
            exhaleRange.value = state.pattern.exhale;
            holdOutRange.value = state.pattern.holdOut;

            inhaleVal.textContent = `${state.pattern.inhale} 秒`;
            holdInVal.textContent = `${state.pattern.holdIn} 秒`;
            exhaleVal.textContent = `${state.pattern.exhale} 秒`;
            holdOutVal.textContent = `${state.pattern.holdOut} 秒`;

            settingsModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        // Range Input Updaters
        const setupRangeSync = (range, valEl) => {
            range.addEventListener('input', (e) => {
                valEl.textContent = `${e.target.value} 秒`;
            });
        };

        setupRangeSync(inhaleRange, inhaleVal);
        setupRangeSync(holdInRange, holdInVal);
        setupRangeSync(exhaleRange, exhaleVal);
        setupRangeSync(holdOutRange, holdOutVal);

        volRange.addEventListener('input', (e) => {
            volVal.textContent = `${e.target.value}%`;
            state.volume = e.target.value / 100;
            if (bgmGainNode && audioCtx) {
                bgmGainNode.gain.setValueAtTime(state.volume * 0.15, audioCtx.currentTime);
            }
        });

        bgmTypeSelect.addEventListener('change', (e) => {
            state.bgmType = e.target.value;
            if (state.bgmEnabled && state.isRunning) {
                startBGM();
            }
        });

        applyCustomBtn.addEventListener('click', () => {
            state.pattern = {
                inhale: parseInt(inhaleRange.value, 10),
                holdIn: parseInt(holdInRange.value, 10),
                exhale: parseInt(exhaleRange.value, 10),
                holdOut: parseInt(holdOutRange.value, 10)
            };

            document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
            settingsModal.classList.add('hidden');
            resetSession();
        });

        // Initialize display
        timeRemainingEl.textContent = formatTime(state.selectedDuration);
    </script>
</body>
</html>
