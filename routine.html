<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライフ便利アシスタント</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-20">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span>✨</span> ライフ便利アシスタント
            </h1>
            <span id="current-date" class="text-xs bg-indigo-500 px-2.5 py-1 rounded-full font-medium">--/--</span>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="max-w-md w-full mx-auto p-4 flex-1">

        <!-- 1. お買い物・持ち物チェックタブ -->
        <section id="tab-shopping" class="tab-content active space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span>🛒</span> お買い物・持ち物リスト
                </h2>
                <form id="shopping-form" class="flex gap-2 mb-3">
                    <input type="text" id="shopping-input" placeholder="買うもの・持ち物を入力..." 
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">追加</button>
                </form>
                <div class="flex justify-between items-center mb-2">
                    <span id="shopping-count" class="text-xs text-slate-500">完了: 0/0</span>
                    <button id="shopping-clear" class="text-xs text-rose-500 hover:underline">完了済みを削除</button>
                </div>
                <ul id="shopping-list" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- リストアイテムがここに入ります -->
                </ul>
            </div>
        </section>

        <!-- 2. 日常の割り勘計算タブ -->
        <section id="tab-calc" class="tab-content space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span>💰</span> かんたん割り勘計算
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">総額 (円)</label>
                        <input type="number" id="calc-total" placeholder="例: 5800" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">人数 (人)</label>
                        <input type="number" id="calc-people" placeholder="例: 3" value="2" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">端数の丸め方</label>
                        <select id="calc-round" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="1">1円単位</option>
                            <option value="10" selected>10円単位で切り上げ</option>
                            <option value="100">100円単位で切り上げ</option>
                        </select>
                    </div>
                </div>

                <div class="mt-5 bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center">
                    <p class="text-xs text-indigo-600 font-medium mb-1">1人あたりの金額</p>
                    <p id="calc-result" class="text-2xl font-extrabold text-indigo-700">0円</p>
                    <p id="calc-diff" class="text-xs text-slate-500 mt-1"></p>
                </div>
            </div>
        </section>

        <!-- 3. 天気・洗濯・お出かけアドバイスタブ -->
        <section id="tab-weather" class="tab-content space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span>☀️</span> 天気・お出かけチェッカー
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">今日の天気を選択</label>
                        <select id="weather-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="sunny">☀️ 晴れ</option>
                            <option value="cloudy">☁️ 曇り</option>
                            <option value="rainy">🌧️ 雨</option>
                            <option value="snowy">❄️ 雪</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">気温の体感</label>
                        <select id="temp-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="hot">🔥 暑い (28℃以上・夏服)</option>
                            <option value="warm" selected>✨ 快適・暖かい (20〜27℃)</option>
                            <option value="cool">🧥 肌寒い (12〜19℃・羽織もの必要)</option>
                            <option value="cold">❄️ 寒い (11℃以下・コート必要)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 space-y-2">
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3">
                        <span class="text-xl">👕</span>
                        <div>
                            <p class="text-xs font-bold text-slate-600">服装アドバイス</p>
                            <p id="advice-clothes" class="text-sm text-slate-700 mt-0.5">-</p>
                        </div>
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3">
                        <span class="text-xl">🧺</span>
                        <div>
                            <p class="text-xs font-bold text-slate-600">洗濯物干し</p>
                            <p id="advice-laundry" class="text-sm text-slate-700 mt-0.5">-</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. ルーティンチェックタブ -->
        <section id="tab-routine" class="tab-content space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span>🌱</span> 毎日の習慣ルーティン
                </h2>
                <form id="routine-form" class="flex gap-2 mb-3">
                    <input type="text" id="routine-input" placeholder="新しい習慣を追加..." 
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">追加</button>
                </form>
                <div class="flex justify-between items-center mb-2">
                    <span id="routine-count" class="text-xs text-slate-500">達成: 0/0</span>
                    <button id="routine-reset" class="text-xs text-indigo-600 hover:underline">チェックをリセット</button>
                </div>
                <ul id="routine-list" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- ルーティンアイテムがここに入ります -->
                </ul>
            </div>
        </section>

    </main>

    <!-- フッターナビゲーションバー（スマホ用タブ） -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="switchTab('shopping')" data-tab="shopping" class="nav-btn flex flex-col items-center flex-1 py-1 text-indigo-600">
                <span class="text-xl">🛒</span>
                <span class="text-[10px] font-medium mt-0.5">お買い物</span>
            </button>
            <button onclick="switchTab('calc')" data-tab="calc" class="nav-btn flex flex-col items-center flex-1 py-1 text-slate-400">
                <span class="text-xl">💰</span>
                <span class="text-[10px] font-medium mt-0.5">割り勘</span>
            </button>
            <button onclick="switchTab('weather')" data-tab="weather" class="nav-btn flex flex-col items-center flex-1 py-1 text-slate-400">
                <span class="text-xl">☀️</span>
                <span class="text-[10px] font-medium mt-0.5">天気予報</span>
            </button>
            <button onclick="switchTab('routine')" data-tab="routine" class="nav-btn flex flex-col items-center flex-1 py-1 text-slate-400">
                <span class="text-[19px]">🌱</span>
                <span class="text-[10px] font-medium mt-0.5">ルーティン</span>
            </button>
